name: Déployer sur le VPS (Astro SSR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-preview
  cancel-in-progress: false

env:
  DEPLOY_PATH: /var/www/preview.bassin-rond.net
  PM2_APP_NAME: site-bassin-rond
  SSH_PORT: '2222'

jobs:
  deployer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
        env:
          PUBLIC_ASSET_VERSION: ${{ github.sha }}
      - run: pnpm run check:budget

      - name: Préparer la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Secret CONTABO_SSH_PRIVATE_KEY manquant." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Envoyer le build Astro SSR sur le VPS
        env:
          VPS_HOST: ${{ secrets.CONTABO_VPS_HOST }}
          VPS_USER: ${{ secrets.CONTABO_VPS_USER }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "Secrets CONTABO_VPS_HOST ou CONTABO_VPS_USER manquants." >&2
            exit 1
          fi
          rsync -rlgoDzvc --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key" \
            dist package.json pnpm-lock.yaml ecosystem.config.cjs data \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Installer les dépendances de prod & redémarrer PM2
        env:
          VPS_HOST: ${{ secrets.CONTABO_VPS_HOST }}
          VPS_USER: ${{ secrets.CONTABO_VPS_USER }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$VPS_USER@$VPS_HOST" \
            "export NVM_DIR=\"\$HOME/.nvm\" && . \"\$NVM_DIR/nvm.sh\" && \
             export PNPM_HOME=\"\$HOME/.local/share/pnpm\" && export PATH=\"\$PNPM_HOME:\$PNPM_HOME/bin:\$PATH\" && \
             cd '$DEPLOY_PATH' && \
             pnpm install --prod --frozen-lockfile && \
             pm2 startOrReload ecosystem.config.cjs --update-env && \
             pm2 save"

      - name: Nettoyer la clé SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
